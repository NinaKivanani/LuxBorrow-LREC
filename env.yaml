name: all_project
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10,<3.12
  - pip
  - pyyaml>=6.0
  - pandas>=2.0
  - matplotlib>=3.8
  # optional but nice to have:
  - numpy>=1.26
  - tqdm>=4.66
  - pip:
      # blingfire is OPTIONAL (our code falls back if it's missing)
      - blingfire>=0.1.8
      # for LLM-assisted LID
      - langdetect>=1.0.9
      # optional LLM client (only used if OPENAI_API_KEY is configured)
      - openai>=1.40.0
